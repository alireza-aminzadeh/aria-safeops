security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Domain\Shared\Entity\User

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/integrations/petroops, roles: PUBLIC_ACCESS }
        - { path: ^/api/vision/ingest, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

    role_hierarchy:
        ROLE_ADMIN: [ROLE_HSE_MANAGER, ROLE_PERMIT_ISSUER, ROLE_OPERATOR]
        ROLE_HSE_MANAGER: [ROLE_PERMIT_ISSUER]
        ROLE_PERMIT_ISSUER: [ROLE_USER]
        ROLE_OPERATOR: [ROLE_USER]
        ROLE_CONTRACTOR: [ROLE_USER]
