name: CI/CD - Aria SafeOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: safeops-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: safeops_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, zip, opcache
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: App env for Composer scripts
        run: cp .env.example .env

      - name: Composer Install
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Lint (php -l)
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: PHPUnit
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/safeops_test?serverVersion=16&charset=utf8"
          APP_ENV: test
          APP_SECRET: ci-test-secret-not-for-production
        run: php bin/phpunit --testdox

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/alireza-aminzadeh/aria-safeops-app:latest
            ghcr.io/alireza-aminzadeh/aria-safeops-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SAFEOPS_SSH_HOST }}
          username: ${{ secrets.SAFEOPS_SSH_USER }}
          key: ${{ secrets.SAFEOPS_SSH_KEY }}
          envs: GITHUB_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /home/deploy/.ssh/id_ed25519_github -o IdentitiesOnly=yes'
            cd /opt/aria-safeops
            if [ ! -d .git ]; then
              git clone git@github.com:alireza-aminzadeh/aria-safeops.git .
            fi
            git fetch origin main
            git reset --hard origin/main
            if [ ! -f .env ]; then
              echo "missing /opt/aria-safeops/.env" >&2
              exit 1
            fi
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi
            upsert() { k="$1"; v="$2"; if grep -q "^${k}=" .env; then sed -i "s|^${k}=.*|${k}=${v}|" .env; else echo "${k}=${v}" >> .env; fi; }
            upsert AI_GATEWAY_ENABLED true
            upsert VISION_SIMULATOR true
            upsert MERCURE_ENABLED true
            upsert MERCURE_URL http://mercure/.well-known/mercure
            upsert MERCURE_PUBLIC_URL https://hse.aria-ai.ir/.well-known/mercure
            if ! grep -q '^MERCURE_JWT_SECRET=.\+' .env; then
              upsert MERCURE_JWT_SECRET "$(openssl rand -hex 32)"
            fi
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u alireza-aminzadeh --password-stdin
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker compose -f docker-compose.yml restart nginx
            docker image prune -f
