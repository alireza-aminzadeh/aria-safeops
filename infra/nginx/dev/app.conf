# Aria SafeOps — Nginx محلی (HTTP فقط) روی پورت ۸۰ داخل کانتینر
# روی هاست به 127.0.0.1:80 نگاشت می‌شود → http://localhost

upstream safe_frontend {
    server host.docker.internal:5174;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/app/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS off;
        fastcgi_read_timeout 60s;
    }

    location / {
        proxy_pass http://safe_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
