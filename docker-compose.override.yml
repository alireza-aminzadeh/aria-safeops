# =====================================================================
# Aria SafeOps — افزوده‌های محیط توسعهٔ محلی (Docker Desktop Windows)
#
# UI: http://localhost  (Nginx روی 127.0.0.1:80؛ PHP-FPM در Docker؛ Vite روی میزبان)
# همزمان با PetroOps اجرا نشود — هر دو روی پورت ۸۰ لوکال هستند.
# فرانت روی میزبان است چون کانتینر Node به npm دسترسی ندارد.
#
# Postgres debug: 127.0.0.1:5433
# Redis debug:    127.0.0.1:6380
# طبق قاعدهٔ امنیتی: فقط bind به 127.0.0.1
# =====================================================================

services:
  nginx:
    ports: !override
      - "127.0.0.1:80:80"
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./infra/nginx/dev:/etc/nginx/conf.d:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !override
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      # =================================================================
      # نکته شبکهٔ محلی (فقط Windows/دِو، هرگز روی Production استفاده
      # نمی‌شود): در برخی شبکه‌ها (فیلترینگ DNS ملی) resolve شدن دامنه‌های
      # بستهٔ نصب (apk/composer/npm) از داخل کانتینر/WSL2 با IP جعلی
      # جواب داده می‌شود، در حالی که اتصال TCP/TLS مستقیم به IP واقعی سالم
      # است. این خطوط فقط hostname→IP واقعی را pin می‌کنند (بدون تغییر
      # رفتار در شبکه‌های سالم). اگر باز هم build شکست خورد، IP جدید را با
      # دستور زیر (که DNS-over-HTTPS واقعی برمی‌گرداند، نه DNS سیستم) پیدا
      # کنید:
      #   Invoke-RestMethod "https://1.1.1.1/dns-query?name=HOST&type=A" -Headers @{accept='application/dns-json'}
      extra_hosts:
        - "dl-cdn.alpinelinux.org=151.101.2.132"
        - "repo.packagist.org=143.244.50.210"
        - "github.com=172.182.252.133"
        - "codeload.github.com=172.182.252.132"
        - "objects.githubusercontent.com=185.199.109.133"
        - "raw.githubusercontent.com=185.199.108.133"
    user: "0:0"
    environment:
      APP_ENV: dev
      ARIA_RUNTIME: local
      SEED_ALIREZA_PASSWORD: alireza
    command: ["sh", "/var/www/app/infra/docker/app-dev.sh"]
    volumes:
      - ./:/var/www/app
    extra_hosts:
      - "repo.packagist.org=143.244.50.210"
      - "github.com=172.182.252.133"
      - "codeload.github.com=172.182.252.132"
      - "objects.githubusercontent.com=185.199.109.133"
      - "raw.githubusercontent.com=185.199.108.133"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  frontend:
    profiles: ["full-docker"]
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /workspace/frontend
    user: "0:0"
    command: ["sh", "/workspace/infra/docker/frontend-dev.sh"]
    volumes:
      - ./:/workspace
    environment:
      VITE_API_BASE: /api
    # نکتهٔ شبکهٔ محلی (بالا در سرویس app توضیح داده شد) — pin کردن IP واقعی npm:
    extra_hosts:
      - "registry.npmjs.org=104.16.9.34"
    networks:
      - aria_safeops_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  postgres:
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    ports:
      - "127.0.0.1:6380:6379"

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
